<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Transform Demo</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>


  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Log Transform Demo</h1>
    </header>

    <h2>Log Transform (logs.json)</h2>
    <trace-visualizer
      data-url="./logs.json"
      trace-id-field="text.BTMID"
      span-group-fields="text.Application,text.Action"
      span-name-field="text.Action"
      service-name-field="text.Application"
      timestamp-field="text.CreateDate"
      status-code-field="text.Code"
      parent-span-lookup-fields="text.InitiatingApplication"
      full-width
      show-legend
    >
      <span-kind-rule kind="Server"   match-field="text.ClassName"  match-value="API"></span-kind-rule>
      <span-kind-rule kind="Client"   match-field="text.MethodName" match-value="LogOutgoingDomainRequest"></span-kind-rule>
      <span-kind-rule kind="Client"   match-field="text.MethodName" match-value="LogReceivedDomainResponse"></span-kind-rule>
      <span-kind-rule kind="Client"   match-field="text.ClassName"  match-value="HttpUtilSync"></span-kind-rule>
      <span-kind-rule kind="Server"   match-field="text.MethodName" match-value="UnaryServerHandler"></span-kind-rule>
      <span-kind-rule kind="Server"   match-field="text.ClassName"  match-value="LoggingInterceptor"></span-kind-rule>
      <span-kind-rule kind="Server"   match-field="text.ClassName"  match-value="ServerLoggingInterceptor"></span-kind-rule>
      <span-kind-rule kind="Server"   match-field="text.ClassName"  match-value="LoggerInterceptor"></span-kind-rule>
      <span-kind-rule kind="Consumer" match-field="text.ClassName"  match-value="&lt;ProcessConsumeResult&gt;d__27"></span-kind-rule>
      <span-kind-rule kind="Consumer" match-field="text.ClassName"  match-value="&lt;ProcessConsumeResult&gt;d__26"></span-kind-rule>
      <span-kind-rule kind="Internal" match-field="text.ClassName"  match-value="DomainServiceMessageInspector"></span-kind-rule>
    </trace-visualizer>

    <footer style="margin-top:3rem;color:#999;font-size:0.85rem;text-align:center">
      Built on <time>__BUILD_DATE__</time> &middot;
      <a href="./">&larr; Back to demos</a>
    </footer>
  </div>

  <script type="module">
    import './dist/log2trace.min.js';
  </script>
</body>
</html>
