<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Transform Demo</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>


  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Log Transform Demo</h1>
    </header>

    <h2>Log Transform (logs.json)</h2>
    <trace-visualizer
      data-url="./logs.json"
      trace-id-field="text.BTMID"
      span-group-fields="text.Application,text.Action"
      span-name-field="text.Action"
      service-name-field="text.Application"
      timestamp-field="text.CreateDate"
      status-code-field="text.Code"
      parent-span-lookup-fields="text.InitiatingApplication"
      full-width
      show-legend
    ></trace-visualizer>

  </div>

  <script type="module">
    import './dist/index.min.js';
  </script>
</body>
</html>
