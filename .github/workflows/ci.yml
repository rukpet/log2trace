name: CI

on:
  pull_request:
  push:
    branches: [main]

# Grant the workflow token read-only access to the repository code (least privilege).
permissions:
  contents: read

# If you push a new commit to the same PR (or branch) while a previous CI run is
# still in progress, automatically cancel the older, outdated run to save time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      # Skip Husky git hook setup (--ignore-scripts) and online npm audit/funding checks.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify commit message
        if: github.event_name == 'pull_request'
        run: |
          git log -1 --pretty=%B > /tmp/commit-msg.txt
          npm run check:commit /tmp/commit-msg.txt

      - name: Verify package version
        run: |
          node -e "const p = require('./package.json'), l = require('./package-lock.json'); if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[a-z]+\.(0|[1-9]\d*))?$/.test(p.version) || l.version !== p.version) { console.error('Expected synchronized version matching x.y.z or x.y.z-tag.N (e.g. 1.0.0-rc.8), got:', p.version); process.exit(1); }"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

      - name: Build package and docs
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      # Skip Husky git hook setup (--ignore-scripts) and online npm audit/funding checks.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
