name: CI

on:
  pull_request:
  push:
    branches: [main]

# Grant the workflow token read-only access to the repository code (least privilege).
permissions:
  contents: read

# If you push a new commit to the same PR (or branch) while a previous CI run is
# still in progress, automatically cancel the older, outdated run to save time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      # Skip Husky git hook setup (--ignore-scripts) and online npm audit/funding checks.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build package and docs
        run: npm run build
