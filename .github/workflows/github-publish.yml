name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build package
        run: npm run build --if-present

      - name: Run unit tests
        run: npm run test:unit

      - name: Configure package scope for GitHub Packages
        run: |
          npm pkg set name="@${{ github.repository_owner }}/log2trace-ui"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"

      - name: Publish to GitHub Packages
        run: |
          PKG_NAME="@${{ github.repository_owner }}/log2trace-ui"
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"-"* ]]; then
            TAG=$(node -p "require('./package.json').version.split('-')[1].replace(/[\\.\\d]+$/, '').toLowerCase() || 'next'")
            VERSIONS_JSON=$(npm view "$PKG_NAME" versions --registry https://npm.pkg.github.com --json 2>/dev/null || true)
            HAS_STABLE=$(node -e "try { const v = JSON.parse(process.argv[1]); console.log((Array.isArray(v) ? v : typeof v === 'string' ? [v] : []).some(s => !s.includes('-'))); } catch { console.log(false); }" "$VERSIONS_JSON")
            if [ "$HAS_STABLE" = "true" ]; then
              npm publish --tag "$TAG"
            else
              npm publish --tag latest
              npm dist-tag add "$PKG_NAME@$VERSION" "$TAG" --registry https://npm.pkg.github.com
            fi
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
