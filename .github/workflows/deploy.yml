name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build package and docs
        run: npm run build

      - name: Assemble site
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          mkdir -p _site/dist
          sed "s/__BUILD_DATE__/$BUILD_DATE/g" demo/demo.html > _site/demo.html
          sed "s/__BUILD_DATE__/$BUILD_DATE/g" demo/otel-trace.html > _site/otel-trace.html
          cp demo/otel-trace.json _site/otel-trace.json
          sed "s/__BUILD_DATE__/$BUILD_DATE/g" demo/logs-transform.html > _site/logs-transform.html
          sed "s/__BUILD_DATE__/$BUILD_DATE/g" demo/benchmark.html > _site/benchmark.html
          sed "s/__BUILD_DATE__/$BUILD_DATE/g" demo/filter-demo.html > _site/filter-demo.html
          sed "s/__BUILD_DATE__/$BUILD_DATE/g" demo/large.html > _site/large.html
          sed "s/__BUILD_DATE__/$BUILD_DATE/g" demo/perf.html > _site/perf.html
          cp demo/perf-gen.js _site/perf-gen.js
          cp demo/guide.html _site/index.html
          cp demo/guide.html _site/guide.html
          cp demo/logs.json _site/logs.json
          cp demo/favicon.svg _site/favicon.svg
          cp dist/log2trace.min.js _site/dist/log2trace.min.js
          cp dist/log2trace.min.js.map _site/dist/log2trace.min.js.map
          cp dist/log2trace.js _site/dist/log2trace.js
          cp dist/log2trace.js.map _site/dist/log2trace.js.map
          cp -r docs _site/api

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
