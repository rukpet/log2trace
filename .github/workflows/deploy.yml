name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Assemble site
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          mkdir -p _site/dist
          sed "s/__BUILD_DATE__/$BUILD_DATE/g" demo/demo.html > _site/index.html
          sed "s/__BUILD_DATE__/$BUILD_DATE/g" demo/otel-trace.html > _site/otel-trace.html
          cp demo/otel-trace.json _site/otel-trace.json
          sed "s/__BUILD_DATE__/$BUILD_DATE/g" demo/logs-transform.html > _site/logs-transform.html
          cp demo/logs.json _site/logs.json
          cp demo/favicon.svg _site/favicon.svg
          cp dist/index.min.js _site/dist/index.min.js
          cp dist/index.min.js.map _site/dist/index.min.js.map

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
